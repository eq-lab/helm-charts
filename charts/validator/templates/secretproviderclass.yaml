{{- if .Values.secretManager.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "validator.fullname" . }}
  labels:
    {{- include "validator.labels" . | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault:8200"
    vaultSkipTLSVerify: "true"
    roleName: {{ .Release.Namespace | quote }}
    objects: |
      {{- $replicaCount := .Values.replicaCount | int }}
      {{- $root := . }}
      {{- range $i := until $replicaCount }}
      {{- range $root.Values.secretManager.secrets }}
      {{- $secretName := printf "%s-%d-env" .name $i }}
      {{- $secretPath := printf "%s/%d" .path $i }}
      - objectName: {{ $secretName }}
        secretPath: {{ $secretPath }}
      {{- end }}
      {{- end }}
{{- end }}
