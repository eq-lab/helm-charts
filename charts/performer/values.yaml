# Number of replicas to deploy
replicaCount: 1

# Container image configuration
image:
  # Docker image repository
  repository: ghcr.io/eq-lab/enjoyoors-avs/execution-service 
  # Image pull policy
  pullPolicy: IfNotPresent 
  # Image tag/version
  tag: "v0.0.8"

# Image pull secrets for private registries
imagePullSecrets:
  - name: github

# Override the chart name
nameOverride: ""
# Override the full name of the chart
fullnameOverride: ""

# Pod annotations
podAnnotations: {}
# Pod security context
podSecurityContext: {}
# Container security context
securityContext: {}

# Resource limits and requests
resources:
  # Resource limits
  limits:
    cpu: 100m
    memory: 256Mi
  # Resource requests
  requests:
    cpu: 100m
    memory: 128Mi

# Performer application configuration
performer:
  # Whether to enable performer
  enabled: true

# Secret manager configuration
secretManager:
  # Whether to enable secret manager
  enabled: true
  # Service account configuration
  serviceAccount:
    # Service account name
    name: "performer-sa"
    # Whether to create service account
    create: false
  # Secrets configuration
  secrets:
    - name: "performer-secrets"
      type: "Opaque"
      path: "secrets/data/performer"
